name: Sync upstream release

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to build, for example v14.0.0. Leave empty for the latest stable release."
        required: false
        type: string
      fix:
        description: "Fix definition in fixes/, for example v15.0.rc1-fix.1. Overrides tag."
        required: false
        type: string
      include_prerelease:
        description: "Use the latest upstream release even if it is a prerelease (only when tag and fix are empty)."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: flameshot-org/flameshot
  QT_VERSION: "6.7.3"
  MACOS_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v6

      - name: Resolve source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          fix="${{ inputs.fix }}"
          tag="${{ inputs.tag }}"
          cherry_picks=""
          if [ -n "$fix" ]; then
            manifest="fixes/${fix}.yml"
            if [ ! -f "$manifest" ]; then
              echo "Fix definition not found: $manifest" >&2
              exit 1
            fi
            tag=$(sed -n 's/^base:[[:space:]]*//p' "$manifest" | head -1)
            cherry_picks=$(sed -n 's/^[[:space:]]*-[[:space:]]*//p' "$manifest" | grep -E '^[0-9a-f]{7,40}$' | tr '\n' ' ' || true)
            release_tag="$fix"
            label="$fix"
            release_title="Flameshot ${tag} + ${fix} for macOS 11+ (arm64)"
            echo "source_kind=fix" >> "$GITHUB_OUTPUT"
          else
            if [ -z "$tag" ]; then
              if [ "${{ inputs.include_prerelease }}" = "true" ]; then
                tag=$(gh api "repos/${UPSTREAM_REPOSITORY}/releases?per_page=1" --jq '.[0].tag_name')
              else
                tag=$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/latest" --jq '.tag_name')
              fi
            fi
            release_tag="macos11-${tag}"
            label="macos11"
            release_title="Flameshot ${tag} for macOS 11+ (arm64)"
            echo "source_kind=release" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "Failed to resolve upstream tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "source_label=$label" >> "$GITHUB_OUTPUT"
          echo "cherry_picks=$cherry_picks" >> "$GITHUB_OUTPUT"
          echo "SOURCE_LABEL=$label" >> "$GITHUB_ENV"
          echo "SOURCE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=$release_title" >> "$GITHUB_ENV"
          echo "Upstream base tag: $tag"
          echo "Release tag: $release_tag"
          echo "Cherry-picks: ${cherry_picks:-none}"

      - name: Check whether release already exists
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${{ steps.source.outputs.release_tag }}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release already exists; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout upstream source
        if: steps.release_check.outputs.exists == 'false'
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ steps.source.outputs.tag }}
          path: upstream
          fetch-depth: 0

      - name: Apply fix cherry-picks
        if: steps.release_check.outputs.exists == 'false' && steps.source.outputs.source_kind == 'fix'
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream config user.name "github-actions[bot]"
          git -C upstream config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for sha in ${{ steps.source.outputs.cherry_picks }}; do
            echo "Cherry-picking $sha"
            git -C upstream cherry-pick -x "$sha"
          done

      - name: Apply patches
        if: steps.release_check.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=(patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "No patches to apply."
            exit 0
          fi
          for patch in "${patches[@]}"; do
            echo "Checking $patch"
            if git -C upstream apply --check "../$patch"; then
              git -C upstream apply "../$patch"
            elif git -C upstream apply --reverse --check "../$patch" >/dev/null 2>&1; then
              echo "Patch already applied; skipping."
            else
              echo "Patch does not apply: $patch" >&2
              exit 1
            fi
          done

      - name: Install Qt
        if: steps.release_check.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/aqt-venv"
          "$RUNNER_TEMP/aqt-venv/bin/pip" install --quiet --upgrade pip aqtinstall
          "$RUNNER_TEMP/aqt-venv/bin/aqt" install-qt mac desktop "$QT_VERSION" clang_64 \
            -O "$RUNNER_TEMP/Qt" \
            --archives qtbase qtsvg qttools qttranslations
          qt_dir="$RUNNER_TEMP/Qt/$QT_VERSION/macos"
          test -d "$qt_dir/lib/cmake/Qt6"
          echo "QT_DIR=$qt_dir" >> "$GITHUB_ENV"

      - name: Print toolchain info
        if: steps.release_check.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          sw_vers
          xcrun --sdk macosx --show-sdk-path
          if ! command -v cmake >/dev/null 2>&1; then brew install cmake; fi
          if ! command -v ninja >/dev/null 2>&1; then brew install ninja; fi
          cmake --version
          ninja --version
          echo "Qt dir: $QT_DIR"

      - name: Configure
        if: steps.release_check.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S upstream -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_DIR" \
            -DQt6_DIR="$QT_DIR/lib/cmake/Qt6" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOS_DEPLOYMENT_TARGET" \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk macosx --show-sdk-path)" \
            -DUSE_MONOCHROME_ICON=True
          grep CMAKE_OSX_DEPLOYMENT_TARGET build/CMakeCache.txt

      - name: Build
        if: steps.release_check.outputs.exists == 'false'
        shell: bash
        run: cmake --build build --parallel 3

      - name: Verify architecture and deployment target
        if: steps.release_check.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          binary="build/src/Flameshot.app/Contents/MacOS/flameshot"
          test -f "$binary"
          lipo -info "$binary"
          lipo -info "$binary" | grep -q arm64
          minos=$(otool -l "$binary" | awk '/LC_BUILD_VERSION/{show=1} show&&/minos/{print $2; exit}')
          echo "minos=$minos"
          test "$minos" = "$MACOS_DEPLOYMENT_TARGET"
          codesign --verify --deep --strict --verbose=2 build/src/Flameshot.app

      - name: Create DMG
        if: steps.release_check.outputs.exists == 'false'
        shell: bash
        run: cmake --build build --target create_dmg

      - name: Collect artifacts
        if: steps.release_check.outputs.exists == 'false'
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^set(FLAMESHOT_VERSION \(.*\))$/\1/p' upstream/CMakeLists.txt | head -1)
          if [ -z "$version" ]; then
            echo "Unable to determine FLAMESHOT_VERSION" >&2
            exit 1
          fi
          src_dmg="build/src/Flameshot-${version}.dmg"
          test -f "$src_dmg"
          if [ "$SOURCE_LABEL" = "macos11" ]; then
            out_dmg="Flameshot-${version}-macos11-arm64.dmg"
          else
            out_dmg="Flameshot-${version}-${SOURCE_LABEL}-macos11-arm64.dmg"
          fi
          cp "$src_dmg" "$out_dmg"
          shasum -a 256 "$out_dmg" > "$out_dmg.sha256"
          echo "dmg=$out_dmg" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        if: steps.release_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          upstream_release_url=$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/tags/${SOURCE_TAG}" --jq '.html_url' 2>/dev/null || true)
          if [ -z "$upstream_release_url" ]; then
            upstream_release_url="https://github.com/${UPSTREAM_REPOSITORY}/releases/tag/${SOURCE_TAG}"
          fi
          {
            echo "Unofficial macOS 11+ (Big Sur) arm64 build of Flameshot ${SOURCE_TAG}."
            echo
            echo "Base upstream tag: ${SOURCE_TAG}"
            if [ "${{ steps.source.outputs.source_kind }}" = "fix" ]; then
              echo "Fix set: ${SOURCE_LABEL}"
              echo "Cherry-picked upstream commits:"
              for sha in ${{ steps.source.outputs.cherry_picks }}; do
                echo "- ${sha}"
              done
            fi
            echo
            echo "Built from upstream source:"
            echo "https://github.com/${UPSTREAM_REPOSITORY}/tree/${SOURCE_TAG}"
            echo
            echo "Build configuration:"
            echo "- Qt: ${QT_VERSION}"
            echo "- Architecture: arm64 (Apple Silicon)"
            echo "- Minimum macOS: ${MACOS_DEPLOYMENT_TARGET}"
            echo "- Signing: ad hoc, not notarized"
            echo
            echo "Upstream release:"
            echo "$upstream_release_url"
            echo
            echo "Checksum: see the attached .sha256 file."
            echo
            echo "Screen Recording permission:"
            echo "These builds are ad-hoc signed. After an update, macOS may still show the old permission as enabled while capturing only a black screen or the wallpaper."
            echo "If that happens:"
            echo "1. Quit Flameshot completely."
            echo "2. Open System Settings -> Privacy & Security -> Screen Recording."
            echo "3. Remove Flameshot with the minus button (do not just toggle it)."
            echo "4. Launch Flameshot, enable the permission when prompted, then quit and relaunch it."
            echo
            echo "License: GPL-3.0. Corresponding source is the upstream tag above plus the listed cherry-picks and any patches in this repository."
            echo
            echo "This build is unofficial and is not affiliated with the Flameshot project."
          } > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Publish release
        if: steps.release_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${{ steps.source.outputs.release_tag }}" \
            "${{ steps.artifacts.outputs.dmg }}" \
            "${{ steps.artifacts.outputs.dmg }}.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "$RELEASE_TITLE" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --target "$GITHUB_SHA"
